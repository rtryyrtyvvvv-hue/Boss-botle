
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Bottle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">
      🍾 <span>Boss Bottle</span>
    </div>

    <div class="top-actions">
      <div class="hearts">
        ❤️ <span id="hearts">100</span>
      </div>

      <button id="storeBtn" class="store-btn">
        🛒 Mağaza
      </button>
    </div>
  </header>


  <main>

    <!-- MASA -->
    <section class="game-area">

      <div class="wood-table">

        <div id="players" class="players"></div>

        <div class="bottle-area">
          <div id="bottle" class="bottle">🍾</div>
          <div id="status" class="status">
            Şüşəni fırlat!
          </div>
        </div>

      </div>

      <button id="spinBtn" class="spin-btn">
        🍾 Şüşəni fırlat
      </button>

    </section>


    <!-- ÇAT -->
    <section class="chat-box">

      <div class="chat-title">
        💬 Söhbət
      </div>

      <div id="chatMessages" class="chat-messages">
        <div class="message">
          <b>Sistem:</b> Boss Bottle-a xoş gəlmisən!
        </div>
      </div>

      <div class="chat-input-area">
        <input
          id="chatInput"
          type="text"
          placeholder="Mesaj yaz..."
          maxlength="100"
        >

        <button id="sendChat">
          Göndər
        </button>
      </div>

    </section>


    <!-- ADMIN -->
    <section class="admin-panel">

      <h3>👑 Admin</h3>

      <div class="admin-row">

        <input
          id="bonusAmount"
          type="number"
          min="1"
          value="10"
        >

        <button id="giveBonus">
          ❤️ Bonus ver
        </button>

      </div
