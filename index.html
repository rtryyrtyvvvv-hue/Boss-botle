<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boss Bottle</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">

    <!-- YUXARI PANEL -->
    <header class="top-bar">

      <div class="heart-box">
        ❤️ <span id="hearts">100</span>
      </div>

      <div class="game-title">
        🍾 Boss Bottle
      </div>

      <div class="bonus-box">
        🎁 <span id="bonus">0</span>
      </div>

    </header>


    <!-- OYUN MASASI -->
    <main class="table">

      <!-- OYUNÇULAR -->
      <div id="players" class="players"></div>


      <!-- ORTADAKI ŞÜŞƏ -->
      <div class="bottle-area">

        <div id="bottle" class="bottle">
          🍾
        </div>

        <div id="status" class="status">
          Növbəti fırlanmanı gözləyirlər
        </div>

        <button id="spinBtn" class="spin-button">
          🍾 Fırlat
        </button>

      </div>

    </main>


    <!-- ÇAT -->
    <section class="chat">

      <div id="chatMessages" class="chat-messages">

        <div class="message">
          <b>Aysel:</b> Salam 👋
        </div>

        <div class="message">
          <b>Murad:</b> Başlayaq 😄
        </div>

        <div class="message">
          <b>Nigar:</b> Mən hazıram ❤️
        </div>

      </div>


      <div class="chat-input">

        <input
          id="chatInput"
          type="text"
          placeholder="Mesaj bura yaz"
          maxlength="100"
        >

        <button id="chatSend">
          ➤
        </button>

      </div>

    </section>


    <!-- BONUS -->
    <section class="bonus-panel">

      <h3>❤️ Bonus</h3>

      <p>
        Ürək bonusunu yalnız admin əlavə edə bilər.
      </p>

      <div class="bonus-controls">

        <input
          id="bonusAmount"
          type="number"
          min="1"
          value="10"
        >

        <button id="giveBtn">
          ❤️ Bonus əlavə et
        </button>

      </div>

    </section>

  </div>


  <script src="app.js"></script>

</body>
</html>
