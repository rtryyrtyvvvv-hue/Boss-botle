<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boss Bottle</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#120907;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

.topbar{
  height:72px;
  background:#180e0b;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #352016;
}

.brand{
  font-size:24px;
  font-weight:900;
  color:#ffd77d;
  white-space:nowrap;
}

.coins{
  background:#21140e;
  border:2px solid #99631e;
  border-radius:30px;
  padding:9px 15px;
  color:#ffe4a5;
  font-size:19px;
  font-weight:bold;
  white-space:nowrap;
}

.game{
  padding:18px 8px 25px;
}

.table{
  width:min(720px,96vw);
  height:min(720px,96vw);
  margin:auto;
  position:relative;
  border-radius:50%;
  background:radial-gradient(
    circle at 50% 45%,
    #8b4c20 0%,
    #6a3617 38%,
    #4a2411 62%,
    #241108 82%,
    #100806 100%
  );
  border:8px solid #a96d21;
  box-shadow:
    inset 0 0 0 4px #5a3215,
    inset 0 0 45px #160805,
    0 12px 30px #000;
}

.table-ring{
  position:absolute;
  left:21%;
  top:21%;
  width:58%;
  height:58%;
  border:6px solid #9b6221;
  border-radius:50%;
  box-shadow:
    inset 0 0 20px #351708,
    0 0 12px #241005;
}

.players{
  position:absolute;
  inset:0;
}

.player{
  position:absolute;
  width:78px;
  text-align:center;
  transform:translate(-50%,-50%);
  z-index:5;
}

.avatar{
  width:68px;
  height:68px;
  margin:auto;
  border:5px solid #e0a03d;
  border-radius:17px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  box-shadow:
    0 4px 10px #000,
    inset 0 0 10px #222;
}

.name{
  margin-top:4px;
  font-size:13px;
  color:#fff;
  white-space:nowrap;
  text-shadow:
    0 2px 3px #000,
    0 0 3px #000;
}

.bottle-area{
  position:absolute;
  left:50%;
  top:50%;
  width:65%;
  height:20%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
}

.bottle{
  width:88%;
  height:55px;
  position:relative;
  transform-origin:50% 50%;
  transition:transform 2.3s cubic-bezier(.15,.75,.2,1);
  filter:drop-shadow(0 6px 5px #000);
}

.bottle-body{
  position:absolute;
  right:0;
  top:3px;
  width:80%;
  height:48px;
  border-radius:25px;
  background:linear-gradient(
    #edfafa,
    #c4dddd 50%,
    #779b9d
  );
  border:3px solid #31575a;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bottle-body span{
  background:#e4aa39;
  color:#241508;
  font-weight:900;
  padding:7px 18px;
  border-radius:8px;
  box-shadow:0 2px 4px #555;
}

.bottle-neck{
  position:absolute;
  left:0;
  top:15px;
  width:27%;
  height:23px;
  background:#d5ecea;
  border:3px solid #31575a;
  border-right:0;
  border-radius:13px 0 0 13px;
}

.bottle-neck:before{
  content:"";
  position:absolute;
  left:-13px;
  top:-5px;
  width:20px;
  height:32px;
  background:#e2b84e;
  border:2px solid #79591e;
  border-radius:8px;
}

.spin-btn{
  position:absolute;
  left:50%;
  bottom:8%;
  transform:translateX(-50%);
  z-index:10;
  border:0;
  border-radius:28px;
  background:linear-gradient(#efb84d,#c98625);
  color:#241407;
  font-weight:900;
  font-size:16px;
  padding:12px 25px;
  box-shadow:
    0 5px 12px #000,
    inset 0 1px #ffe3a0;
  cursor:pointer;
}

.spin-btn:active{
  transform:translateX(-50%) scale(.95);
}

.result{
  position:absolute;
  left:50%;
  bottom:2%;
  transform:translateX(-50%);
  z-index:10;
  color:#ffe4ad;
  font-size:13px;
  white-space:nowrap;
  text-shadow:0 2px 3px #000;
}

.bottom-panel{
  width:min(720px,96vw);
  margin:16px auto 0;
  background:#1d100c;
  border:2px solid #5b391b;
  border-radius:18px;
  padding:13px;
}

.chat-title{
  color:#ffd47d;
  font-size:20px;
  font-weight:900;
  margin-bottom:9px;
}

.chat-box{
  height:110px;
  overflow:auto;
  background:#100806;
  border-radius:12px;
  padding:10px;
  font-size:15px;
  border:1px solid #24150f;
}

.chat-row{
  display:flex;
  gap:8px;
  margin-top:9px;
}

.chat-row input{
  flex:1;
  min-width:0;
  border:0;
  outline:none;
  border-radius:12px;
  padding:13px;
  font-size:16px;
}

.chat-row button{
  border:0;
  border-radius:12px;
  padding:0 18px;
  background:#dfa13a;
  color:#241407;
  font-weight:900;
  font-size:15px;
}

@media(max-width:560px){

  .topbar{
    height:68px;
    padding:0 11px;
  }

  .brand{
    font-size:20px;
  }

  .coins{
    font-size:16px;
    padding:8px 11px;
  }

  .game{
    padding-top:14px;
  }

  .table{
    width:96vw;
    height:96vw;
    border-width:7px;
  }

  .player{
    width:65px;
  }

  .avatar{
    width:57px;
    height:57px;
    border-width:4px;
    border-radius:15px;
    font-size:34px;
  }

  .name{
    font-size:11px;
    margin-top:3px;
  }

  .bottle{
    height:40px;
  }

  .bottle-body{
    height:35px;
    top:3px;
  }

  .bottle-body span{
    padding:5px 14px;
    font-size:14px;
  }

  .bottle-neck{
    height:17px;
    top:10px;
  }

  .bottle-neck:before{
    height:27px;
    width:17px;
  }

  .spin-btn{
    font-size:14px;
    padding:10px 20px;
    bottom:8%;
  }

  .result{
    font-size:11px;
  }

  .bottom-panel{
    width:96vw;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    🍾 BOSS BOTTLE
  </div>

  <div class="coins">
    🪙 <span id="coins">1000</span>
  </div>

</header>

<main class="game">

  <section class="table" id="table">

    <div class="table-ring"></div>

    <div class="players" id="players"></div>

    <div class="bottle-area">

      <div class="bottle" id="bottle">

        <div class="bottle-neck"></div>

        <div class="bottle-body">
          <span>BOSS</span>
        </div>

      </div>

    </div>

    <button class="spin-btn" id="spinBtn">
      🍾 FƏRİLƏT
    </button>

    <div class="result" id="result">
      Şüşəni fırlat
    </div>

  </section>

  <section class="bottom-panel">

    <div class="chat-title">
      💬 CANLI CHAT
    </div>

    <div class="chat-box" id="chatBox">

      <div>
        <b>Boss:</b>
        Oyuna xoş gəlmisiniz!
      </div>

    </div>

    <div class="chat-row">

      <input
        id="chatInput"
        type="text"
        placeholder="Mesaj yaz..."
      >

      <button id="sendBtn">
        Göndər
      </button>

    </div>

  </section>

</main>

<script src="app.js"></script>

</body>
</html>
