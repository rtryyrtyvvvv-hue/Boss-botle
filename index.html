<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boss Bottle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">🍾 <b>Boss Bottle</b></div>
    <div class="coins">🪙 <span id="coins">100</span></div>
  </header>

  <main>
    <div class="table">
      <div id="players"></div>
      <div class="bottle-wrap">
        <div id="bottle" class="bottle">🍾</div>
        <div class="status" id="status">Fırlatmağa hazırsan?</div>
      </div>
    </div>

    <div class="controls">
      <button id="spinBtn">🍾 Şüşəni fırlat</button>
      <button id="bonusBtn" class="secondary">🎁 Gündəlik bonus</button>
    </div>

    <section class="panel">
      <h3>👑 Admin</h3>
      <p>Bu demo rejimində admin yalnız sən kimi göstərilir.</p>
      <div class="admin-row">
        <input id="bonusAmount" type="number" min="1" value="25">
        <button id="giveBtn">Bonus əlavə et</button>
      </div>
      <small>Real oyunda bu hüquq serverdə Telegram istifadəçi ID-si ilə qorunmalıdır.</small>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
