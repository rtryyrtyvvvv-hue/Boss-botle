<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boss Bottle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #17100b;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .game {
      width: 100%;
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      padding: 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #ffd27a;
    }

    .coins {
      background: #2b1b0e;
      border: 1px solid #8d5b24;
      border-radius: 20px;
      padding: 8px 14px;
      color: #ffd27a;
    }

    .table {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 620px;
      margin: 20px auto;
      border-radius: 50%;
      background:
        radial-gradient(circle, #70451e 0%, #4d2b13 45%, #2d180b 75%);
      border: 12px solid #211207;
      box-shadow:
        0 0 0 4px #9b6125,
        inset 0 0 40px #140a04,
        0 10px 30px #000;
    }

    .center {
      position: absolute;
      width: 48%;
      height: 48%;
      left: 26%;
      top: 26%;
      border-radius: 50%;
      background: #5c3517;
      border: 5px solid #a66b2c;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bottle {
      width: 150px;
      height: 42px;
      position: relative;
      transform: rotate(0deg);
      transition: transform 2.2s cubic-bezier(.15,.8,.2,1);
      filter: drop-shadow(0 5px 5px #000);
