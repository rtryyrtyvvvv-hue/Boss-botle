<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Bottle</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#160d09;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

.topbar{
  height:74px;
  background:#17100d;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.brand{
  font-size:25px;
  font-weight:800;
  color:#ffd982;
}

.coins{
  border:2px solid #8b5d1d;
  border-radius:32px;
  padding:10px 17px;
  color:#ffe2a0;
  font-size:21px;
  background:#21160e;
}

.game{
  padding:12px 10px 30px;
}

.table{
  width:min(720px,96vw);
  height:min(720px,96vw);
  margin:0 auto;
  position:relative;
  border-radius:50%;
  background:
  radial-gradient(circle at 50% 50%,
  #713d19 0%,
  #4a2712 47%,
  #24130b 76%,
  #120a07 100%);
  border:7px solid #9b641f;
  box-shadow:
  inset 0 0 35px #0b0502,
  0 10px 30px #000;
}

.table-ring{
  position:absolute;
  left:23%;
  top:23%;
  width:54%;
  height:54%;
  border:6px solid #9a6424;
  border-radius:50%;
}

.players{
  position:absolute;
  inset:0;
}

.player{
  position:absolute;
  width:82px;
  text-align:center;
  transform:translate(-50%,-50%);
}

.avatar{
  width:72px;
  height:72px;
  border:5px solid #d99b42;
  border-radius:18px;
  background:#12100e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  box-shadow:0 4px 12px #000;
}

.name{
  margin-top:5px;
  font-size:15px;
  text-shadow:0 2px 3px #000;
  white-space:nowrap;
}

.bottle-area{
  position:absolute;
  left:50%;
  top:50%;
  width:58%;
  height:18%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
}

.bottle{
  width:82%;
  height:48px;
  position:relative;
  transform-origin:50% 50%;
  transition:
    transform 2.2s cubic-bezier(.15,.75,.2,1);
  filter:drop-shadow(0 5px 5px #000);
}

.bottle-body{
  position:absolute;
  right:0;
  top:3px;
  width:82%;
  height:42px;
  border-radius:24px;
  background:linear-gradient(
    #eef9f7,
    #a9d0cf 55%,
    #72999a
  );
  border:3px solid #294b4d;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bottle-body span{
  background:#e2aa39;
  color:#241508;
  font-weight:800;
  padding:7px 17px;
  border-radius:7px;
}

.bottle-neck{
  position:absolute;
  left:0;
  top:13px;
  width:25%;
  height:20px;
  background:#d2e9e7;
  border:3px solid #294b4d;
  border-right:0;
  border-radius:12px 0 0 12px;
}

.bottle-neck:before{
  content:"";
  position:absolute;
  left:-12px;
  top:-5px;
  width:18px;
  height:30px;
  background:#e0b94e;
  border-radius:8px;
  border:2px solid #76551c;
}

.bottom-panel{
  width:min(720px,96vw);
  margin:14px auto 0;
  background:#21130d;
  border:1px solid #5d3a1c;
  border-radius:16px;
  padding:12px;
}

.chat-title{
  font-weight:800;
  color:#ffd47d;
  margin-bottom:8px;
}

.chat-box{
  height:110px;
  overflow:auto;
  background:#130b08;
  border-radius:10px;
  padding:9px;
  font-size:14px;
}

.chat-row{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.chat-row input{
  flex:1;
  min-width:0;
  border:0;
  border-radius:10px;
  padding:11px;
}

.chat-row button{
  border:0;
  border-radius:10px;
  padding:0 15px;
  background:#d89b39;
  font-weight:700;
}

@media(max-width:560px){

  .brand{
    font-size:21px;
  }

  .coins{
    font-size:17px;
    padding:8px 12px;
  }

  .table{
    width:94vw;
    height:94vw;
  }

  .avatar{
    width:58px;
    height:58px;
    font-size:35px;
  }

  .player{
    width:66px;
  }

  .name{
    font-size:12px;
  }

  .bottle{
    height:39px;
  }

  .bottle-body{
    height:35px;
  }

  .bottle-neck{
    height:16px;
    top:10px;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    🍾 BOSS BOTTLE
  </div>

  <div class="coins">
    🪙 <span id="coins">1000</span>
  </div>

</header>


<main class="game">

  <section class="table" id="table">

    <div class="table-ring"></div>

    <div class="players" id="players"></div>

    <div class="bottle-area">

      <div class="bottle" id="bottle">

        <div class="bottle-neck"></div>

        <div class="bottle-body">
          <span>BOSS</span>
        </div>

      </div>

    </div>

  </section>


  <section class="bottom-panel">

    <div class="chat-title">
      💬 CANLI CHAT
    </div>

    <div class="chat-box" id="chatBox">
      <div>
        <b>Boss:</b> Oyuna xoş gəlmisiniz!
      </div>
    </div>

    <div class="chat-row">

      <input
        id="chatInput"
        placeholder="Mesaj yaz..."
      >

      <button id="sendBtn">
        Göndər
      </button>

    </div>

  </section>

</main>


<script src="app.js"></script>

</body>
</html>
