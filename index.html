<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Bottle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div class="logo">🍾 <b>Boss Bottle</b></div>

  <div class="top-actions">
    <div class="heart">❤️ <span id="hearts">100</span></div>
    <button>🛒 Mağaza</button>
  </div>
</header>

<main>

<section class="game">

  <div class="game-top">
    <span>❤️ 100</span>
    <span>⚔️</span>
    <span>🏆</span>
    <span>☰</span>
    <span>⚙️</span>
    <b>Masa 12</b>
  </div>

  <div id="table" class="table">

    <div id="players"></div>

    <div id="bottle" class="bottle">
      🍾
    </div>

    <div class="spin-hint">
      Şüşəni fırlat
    </div>

  </div>

  <button id="spinBtn" class="spin-btn">
    🍾 Şüşəni fırlat
  </button>

</section>


<section class="chat">

  <h2>💬 Söhbət</h2>

  <div id="messages">
    <p><b>Sistem:</b> Boss Bottle-a xoş gəlmisən!</p>
  </div>

  <div class="chat-row">
    <input id="chatInput" placeholder="Mesaj yaz...">
    <button id="sendBtn">Göndər</button>
  </div>

</section>


<section class="admin">

  <h2>👑 Admin</h2>

  <p class="admin-note">
    Bonus yalnız admin tərəfindən verilə bilər.
  </p>

  <div class="admin-row">

    <input
      id="bonusInput"
      type="number"
      value="10"
      min="1"
    >

    <button id="bonusBtn">
      ❤️ Bonus ver
    </button>

  </div>

  <div id="adminMsg"></div>

</section>

</main>

<script src="app.js"></script>

</body>
</html>
