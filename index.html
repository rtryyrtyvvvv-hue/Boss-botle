<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boss Bottle</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #17100b;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .game {
      width: 100%;
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      padding: 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #ffd27a;
    }

    .coins {
      background: #2b1b0e;
      border: 1px solid #8d5b24;
      border-radius: 20px;
      padding: 8px 14px;
      color: #ffd27a;
    }

    .table {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 620px;
      margin: 20px auto;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          #70451e 0%,
          #4d2b13 45%,
          #2d180b 75%
        );

      border: 12px solid #211207;

      box-shadow:
        0 0 0 4px #9b6125,
        inset 0 0 40px #140a04,
        0 10px 30px #000;
    }

    .center {
      position: absolute;
      width: 48%;
      height: 48%;
      left: 26%;
      top: 26%;

      border-radius: 50%;
      background: #5c3517;
      border: 5px solid #a66b2c;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ŞÜŞƏ */

    .bottle {
      width: 150px;
      height: 42px;
      position: relative;

      transform: rotate(0deg);

      transition:
        transform 2.2s cubic-bezier(.15,.8,.2,1);

      filter: drop-shadow(0 5px 5px #000);
    }

    .bottle-body {
      position: absolute;

      width: 100px;
      height: 34px;

      left: 25px;
      top: 4px;

      border-radius: 17px;

      background:
        linear-gradient(
          to bottom,
          #e8f0ef,
          #7b9994,
          #dce7e4
        );

      border: 2px solid #263d39;
    }

    .bottle-neck {
      position: absolute;

      width: 35px;
      height: 14px;

      left: 0;
      top: 14px;

      background: #b8cfca;

      border: 2px solid #263d39;

      border-radius: 8px 0 0 8px;
    }

    .bottle-cap {
      position: absolute;

      width: 13px;
      height: 18px;

      left: -8px;
      top: 12px;

      background: #d8b34d;

      border-radius: 4px;
    }

    .bottle-label {
      position: absolute;

      left: 51px;
      top: 9px;

      width: 48px;
      height: 24px;

      background: #d4a443;

      color: #27170a;

      border-radius: 5px;

      text-align: center;
      line-height: 24px;

      font-size: 9px;
      font-weight: bold;
    }

    /* OYUNÇULAR */

    .player {
      position: absolute;

      width: 78px;

      text-align: center;

      transform: translate(-50%, -50%);
    }

    .avatar {
      width: 62px;
      height: 62px;

      margin: auto;

      border-radius: 12px;

      background: #302018;

      border: 3px solid #d39b45;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 30px;

      box-shadow: 0 4px 10px #000;
    }

    .name {
      margin-top: 4px;

      font-size: 12px;

      color: #fff;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    /* 12 OYUNÇU */

    .p1 {
      left: 50%;
      top: 3%;
    }

    .p2 {
      left: 72%;
      top: 8%;
    }

    .p3 {
      left: 90%;
      top: 25%;
    }

    .p4 {
      left: 97%;
      top: 50%;
    }

    .p5 {
      left: 90%;
      top: 75%;
    }

    .p6 {
      left: 72%;
      top: 92%;
    }

    .p7 {
      left: 50%;
      top: 97%;
    }

    .p8 {
      left: 28%;
      top: 92%;
    }

    .p9 {
      left: 10%;
      top: 75%;
    }

    .p10 {
      left: 3%;
      top: 50%;
    }

    .p11 {
      left: 10%;
      top: 25%;
    }

    .p12 {
      left: 28%;
      top: 8%;
    }

    /* DÜYMƏ */

    .controls {
      text-align: center;

      margin-top: 20px;
    }

    #spinButton {
      border: 0;

      border-radius: 15px;

      padding: 16px 45px;

      font-size: 20px;

      font-weight: bold;

      color: #2b1807;

      background:
        linear-gradient(
          #ffd978,
          #b87921
        );

      box-shadow:
        0 5px 0 #70400f;

      cursor: pointer;
    }

    #spinButton:active {
      transform: translateY(4px);

      box-shadow:
        0 1px 0 #70400f;
    }

    #spinButton:disabled {
      opacity: .5;

      cursor: not-allowed;
    }

    #result {
      margin-top: 15px;

      min-height: 28px;

      color: #ffd27a;

      font-size: 18px;

      font-weight: bold;
    }

    /* AŞAĞI PANEL */

    .panel {
      margin-top: 25px;

      padding: 15px;

      background: #21150e;

      border: 1px solid #68411d;

      border-radius: 15px;
    }

    .panel h3 {
      margin: 0 0 8px;

      color: #ffd27a;
    }

    .panel p {
      margin: 5px 0;

      color: #d8c1a5;
    }

    /* TELEFON */

    @media (max-width: 450px) {

      .logo {
        font-size: 20px;
      }

      .player {
        width: 65px;
      }

      .avatar {
        width: 52px;
        height: 52px;

        font-size: 25px;
      }

      .name {
        font-size: 10px;
      }

      .bottle {
        width: 120px;
      }

      #spinButton {
        padding: 14px 30px;

        font-size: 18px;
      }
    }
  </style>
</head>
