<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boss Bottle</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#120907;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

/* YUXARI PANEL */
.topbar{
  height:72px;
  background:#180e0b;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #352016;
}

.brand{
  font-size:24px;
  font-weight:900;
  color:#ffd77d;
  white-space:nowrap;
}

.coins{
  background:#21140e;
  border:2px solid #99631e;
  border-radius:30px;
  padding:9px 15px;
  color:#ffe4a5;
  font-size:19px;
  font-weight:bold;
  white-space:nowrap;
}

/* OYUN */
.game{
  padding:18px 8px 25px;
}

/* MASA */
.table{
  width:min(720px,96vw);
  height:min(720px,96vw);
  margin:auto;
  position:relative;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 50% 45%,
      #8b4c20 0%,
      #6a3617 38%,
      #4a2411 62%,
      #241108 82%,
      #100806 100%
    );

  border:8px solid #a96d21;

  box-shadow:
    inset 0 0 0 4px #5a3215,
    inset 0 0 45px #160805,
    0 12px 30px #000;
}

/* MASANIN İÇ HALQƏSİ */
.table-ring{
  position:absolute;
  left:21%;
  top:21%;
  width:58%;
  height:58%;
  border:6px solid #9b6221;
  border-radius:50%;
  box-shadow:
    inset 0 0 20px #351708,
    0 0 12px #241005;
}

/* OYUNÇULAR */
.players{
  position:absolute;
  inset:0;
}

.player{
  position:absolute;
  width:78px;
  text-align:center;
  transform:translate(-50%,-50%);
  z-index:5;
}

.avatar{
  width:68px;
  height:68px;

  margin:auto;

  border:5px solid #e0a03d;
